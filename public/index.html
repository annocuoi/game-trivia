<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Đố Vui Trực Tuyến</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 90vh; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 420px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 8px; font-weight: bold; }
        .btn-start { background: #ffc107; color: #000; }
        .btn-success { background: #28a745; }
        .btn-danger { background: #dc3545; }
        .error { color: red; margin-top: 8px; font-size: 14px; font-weight: bold; }
        .hidden { display: none !important; }
        ul { list-style: none; padding: 0; text-align: left; }
        ul li { padding: 8px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        
        #chat-box { height: 120px; border: 1px solid #ddd; overflow-y: auto; text-align: left; padding: 8px; background: #f9f9f9; border-radius: 6px; margin: 10px 0; font-size: 14px; }
        .chat-row { margin-bottom: 5px; }
        .chat-user { font-weight: bold; color: #007bff; }

        .timer-badge { background: #ff4757; color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 18px; display: inline-block; margin-bottom: 10px; }
        .leaderboard { margin-top: 20px; border-top: 2px solid #eee; padding-top: 10px; }
        .leaderboard-item { display: flex; justify-content: space-between; padding: 6px 10px; background: #f8f9fa; margin-bottom: 4px; border-radius: 6px; font-size: 14px; }
    </style>
</head>
<body>

    <!-- SẢNH CHÍNH: BẤM VÀO LÀ NHẬP TÊN NGAY -->
    <div id="lobby-screen" class="card">
        <h2>🎮 Đố Vui Trực Tuyến</h2>
        
        <input type="text" id="display-name-input" placeholder="Tên của bạn là gì?">

        <hr style="margin: 15px 0;">
        <h3>Tạo Phòng Mới</h3>
        <input type="password" id="new-room-pass" placeholder="Mật khẩu phòng (nếu muốn đặt)">
        <button class="btn-success" onclick="createRoom()">Tạo Phòng</button>

        <h3 style="margin-top: 20px;">Vào Phòng Có Sẵn</h3>
        <input type="text" id="join-room-code" placeholder="Nhập Mã phòng 4 số">
        <input type="password" id="join-room-pass" placeholder="Mật khẩu phòng (nếu có)">
        <button onclick="joinRoom()">Tham Gia</button>
        <div id="lobby-error" class="error"></div>
    </div>

    <!-- PHÒNG CHỜ -->
    <div id="room-screen" class="card hidden">
        <h2>Phòng: <span id="room-code-display"></span></h2>
        
        <p style="text-align: left; font-weight: bold; margin-bottom: 5px;">Thành viên trong phòng:</p>
        <ul id="players-list"></ul>

        <button id="start-btn" class="btn-start hidden" onclick="startGame()">Bắt Đầu Chơi</button>
        <button id="ready-btn" class="btn-success hidden" onclick="toggleReady()">Sẵn Sàng</button>
        <div id="room-error" class="error"></div>

        <div id="chat-box"></div>
        <div style="display: flex; gap: 5px;">
            <input type="text" id="chat-input" placeholder="Nhập tin nhắn..." style="margin:0;">
            <button onclick="sendChat()" style="width: auto; margin:0; padding: 10px 15px;">Gửi</button>
        </div>

        <button class="btn-danger" onclick="leaveRoom()" style="margin-top: 15px;">Rời Phòng</button>
    </div>

    <!-- MÀN HÌNH CHƠI GAME -->
    <div id="game-screen" class="card hidden">
        <div class="timer-badge">⏳ <span id="timer-text">10</span>s</div>
        <h3 id="question-number" style="margin: 5px 0;">Câu hỏi</h3>
        <h2 id="question-text" style="color: #333; margin: 15px 0;">Nội dung câu hỏi</h2>
        
        <input type="text" id="answer-input" placeholder="Nhập câu trả lời...">
        <button id="submit-btn" onclick="submitAnswer()">Gửi Đáp Án</button>
        
        <div id="game-msg" style="margin-top: 15px; font-weight: bold;"></div>

        <div class="leaderboard">
            <p style="font-weight: bold; text-align: left; margin: 10px 0 5px 0;">🏆 Bảng Xếp Hạng:</p>
            <div id="leaderboard-list"></div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentDisplayName = '';
        let currentRoomCode = '';

        window.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('game_display_name');
            if (savedName) {
                document.getElementById('display-name-input').value = savedName;
            }
        });

        function getDisplayName() {
            const name = document.getElementById('display-name-input').value.trim();
            if (!name) {
                document.getElementById('lobby-error').innerText = 'Vui lòng nhập tên trước!';
                return null;
            }
            localStorage.setItem('game_display_name', name);
            return name;
        }

        function createRoom() {
            currentDisplayName = getDisplayName();
            if (!currentDisplayName) return;

            const roomPassword = document.getElementById('new-room-pass').value.trim();
            socket.emit('create_room', { displayName: currentDisplayName, roomPassword });
        }

        function joinRoom() {
            currentDisplayName = getDisplayName();
            if (!currentDisplayName) return;

            const roomCode = document.getElementById('join-room-code').value.trim();
            const roomPassword = document.getElementById('join-room-pass').value.trim();
            if (!roomCode) return document.getElementById('lobby-error').innerText = 'Nhập mã phòng!';
            
            socket.emit('join_room', { roomCode, roomPassword, displayName: currentDisplayName });
        }

        socket.on('room_created', (data) => enterRoomUI(data.roomCode, data.isHost));
        socket.on('join_success', (data) => enterRoomUI(data.roomCode, data.isHost));
        socket.on('join_error', (msg) => document.getElementById('lobby-error').innerText = msg);

        function enterRoomUI(code, isHost) {
            currentRoomCode = code;
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('room-screen').classList.remove('hidden');
            document.getElementById('room-code-display').innerText = code;
            document.getElementById('room-error').innerText = '';

            if (isHost) {
                document.getElementById('start-btn').classList.remove('hidden');
                document.getElementById('ready-btn').classList.add('hidden');
            } else {
                document.getElementById('start-btn').classList.add('hidden');
                document.getElementById('ready-btn').classList.remove('hidden');
            }
        }

        socket.on('update_players', (players) => {
            const list = document.getElementById('players-list');
            list.innerHTML = '';
            players.forEach(p => {
                const li = document.createElement('li');
                let statusHtml = '';
                
                if (p.isHost) {
                    statusHtml = '<span style="color:#d97706; font-weight:bold;">👑 Chủ phòng</span>';
                } else if (p.ready) {
                    statusHtml = '<span style="color:green; font-weight:bold;">✓ Sẵn sàng</span>';
                } else {
                    statusHtml = '<span style="color:red; font-weight:bold;">Chưa sẵn sàng</span>';
                }

                li.innerHTML = `<span>• ${p.displayName}</span> ${statusHtml}`;
                list.appendChild(li);
            });
        });

        function toggleReady() {
            socket.emit('toggle_ready', { roomCode: currentRoomCode });
        }

        function sendChat() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (message) {
                socket.emit('send_chat', { roomCode: currentRoomCode, displayName: currentDisplayName, message });
                input.value = '';
            }
        }

        socket.on('receive_chat', (data) => {
            const box = document.getElementById('chat-box');
            box.innerHTML += `<div class="chat-row"><span class="chat-user">${data.displayName}:</span> ${data.message}</div>`;
            box.scrollTop = box.scrollHeight;
        });

        function startGame() {
            socket.emit('start_game', { roomCode: currentRoomCode });
        }

        socket.on('start_error', (msg) => document.getElementById('room-error').innerText = msg);

        socket.on('game_started', () => {
            document.getElementById('room-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
        });

        socket.on('next_question', (data) => {
            document.getElementById('question-number').innerText = `Câu ${data.number}/${data.total}`;
            document.getElementById('question-text').innerText = data.question;
            document.getElementById('timer-text').innerText = data.timeLeft;
            document.getElementById('answer-input').value = '';
            document.getElementById('answer-input').disabled = false;
            document.getElementById('submit-btn').disabled = false;
            document.getElementById('game-msg').innerText = '';
            
            updateLeaderboard(data.players);
        });

        socket.on('timer_tick', (data) => {
            document.getElementById('timer-text').innerText = data.timeLeft;
        });

        function submitAnswer() {
            const answer = document.getElementById('answer-input').value.trim();
            if (answer) {
                socket.emit('submit_answer', { roomCode: currentRoomCode, displayName: currentDisplayName, answer });
            }
        }

        socket.on('answer_result', (data) => {
            const msgEl = document.getElementById('game-msg');
            if (data.correct) {
                msgEl.style.color = 'green';
                msgEl.innerText = `🎉 Bạn trả lời đúng! (+${data.points} điểm)`;
                document.getElementById('answer-input').disabled = true;
                document.getElementById('submit-btn').disabled = true;
            } else {
                msgEl.style.color = 'red';
                msgEl.innerText = '❌ Sai rồi, thử lại xem!';
            }
        });

        socket.on('correct_answer', (data) => {
            const msgEl = document.getElementById('game-msg');
            msgEl.innerText += `\n👏 ${data.displayName} vừa đoán đúng (+${data.points}đ)`;
            updateLeaderboard(data.players);
        });

        socket.on('show_answer', (data) => {
            const msgEl = document.getElementById('game-msg');
            msgEl.style.color = '#007bff';
            msgEl.innerText = `⏰ HẾT GIỜ! Đáp án đúng là: ${data.correctAnswer}`;
            document.getElementById('answer-input').disabled = true;
            document.getElementById('submit-btn').disabled = true;
        });

        function updateLeaderboard(players) {
            const board = document.getElementById('leaderboard-list');
            board.innerHTML = '';
            const sorted = [...players].sort((a,b) => b.score - a.score);
            sorted.forEach((p, index) => {
                const item = document.createElement('div');
                item.className = 'leaderboard-item';
                item.innerHTML = `<span><b>#${index+1}</b> ${p.displayName}</span> <b>${p.score} điểm</b>`;
                board.appendChild(item);
            });
        }

        socket.on('game_over', (players) => {
            let msg = '🏆 GAME KẾT THÚC!\n\nBảng Điểm Chung Cuộc:\n';
            players.sort((a,b) => b.score - a.score).forEach((p, i) => msg += `#${i+1} ${p.displayName}: ${p.score} điểm\n`);
            alert(msg);
            location.reload();
        });

        function leaveRoom() { location.reload(); }
    </script>
</body>
</html>
