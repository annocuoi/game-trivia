<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Đố Vui Trực Tuyến</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 90vh; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 420px; text-align: center; }
        input, select { width: 90%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 8px; font-weight: bold; }
        button:hover { opacity: 0.9; }
        .btn-success { background: #28a745; }
        .btn-danger { background: #dc3545; }
        .error { color: red; margin-top: 8px; font-size: 14px; font-weight: bold; }
        ul { list-style: none; padding: 0; text-align: left; }
        ul li { padding: 8px; border-bottom: 1px solid #eee; }
        #chat-messages { height: 120px; border: 1px solid #ddd; overflow-y: auto; text-align: left; padding: 8px; background: #f9f9f9; border-radius: 6px; margin: 10px 0; font-size: 14px; }
        .cooldown { color: red; font-size: 13px; margin-top: 4px; }
        .category-box { background: #eef2ff; border: 1px solid #c7d2fe; padding: 10px; border-radius: 8px; margin: 12px 0; font-weight: bold; color: #3730a3; }
    </style>
</head>
<body>

    <!-- BƯỚC 1: NHẬP TÊN -->
    <div id="step-name-screen" class="card">
        <h2>🎮 Đố Vui Trực Tuyến</h2>
        <input type="text" id="username" placeholder="Nhập tên của bạn...">
        <button onclick="goToRoomChoice()">Tiếp Tục</button>
        <div id="name-error" class="error"></div>
    </div>

    <!-- BƯỚC 2: TẠO PHÒNG HOẶC VÀO PHÒNG -->
    <div id="step-room-screen" class="card" style="display: none;">
        <p>Xin chào, <strong id="user-display-name"></strong>!</p>
        
        <h3>Tạo Phòng Mới</h3>
        <input type="password" id="create-pass" placeholder="Mật khẩu phòng (không bắt buộc)">
        <button class="btn-success" onclick="createRoom()">Tạo Phòng</button>

        <hr style="margin: 20px 0;">

        <h3>Vào Phòng Có Sẵn</h3>
        <input type="text" id="join-code" placeholder="Nhập mã phòng 4 số">
        <input type="password" id="join-pass" placeholder="Mật khẩu phòng (nếu có)">
        <button onclick="joinRoom()">Vào Phòng</button>
        
        <div id="room-error" class="error"></div>
    </div>

    <!-- BƯỚC 3: SẢNH CHỜ (LOBBY ROOM) -->
    <div id="lobby-screen" class="card" style="display: none;">
        <h2>Sảnh Chờ</h2>
        <p style="font-size: 18px;">Mã Phòng: <strong id="room-code-display" style="color: #007bff;"></strong></p>
        <p>Số người trong phòng: <strong id="player-count-lobby">0</strong></p>
        
        <!-- MỤC LỰA CHỌN CHỦ ĐỀ -->
        <div class="category-box">
            <label for="category-select" style="display: block; margin-bottom: 5px;">📚 Chủ Đề Câu Hỏi:</label>
            <div id="host-category-select">
                <select id="category-select" onchange="changeCategory()">
                    <option value="Tất cả">🎲 Tất Cả Chủ Đề</option>
                    <option value="Game Hoa Viên">🌸 Game Hoa Viên</option>
                    <option value="Lịch sử">📜 Lịch Sử</option>
                    <option value="Địa lý">🗺️ Địa Lý</option>
                    <option value="Văn học">📖 Văn Học</option>
                    <option value="Toán học">📐 Toán Học</option>
                    <option value="Khoa học vũ trụ">🚀 Khoa Học Vũ Trụ</option>
                    <option value="Hóa học">🧪 Hóa Học</option>
                </select>
            </div>
            <div id="player-category-display" style="display: none; font-size: 16px; color: #1e40af;">
                <span id="current-category-text">Tất Cả Chủ Đề</span>
            </div>
        </div>

        <h3>Danh sách người chơi:</h3>
        <ul id="player-list-lobby"></ul>

        <!-- Điều khiển Host -->
        <div id="host-controls" style="display: none;">
            <button onclick="startGame()" style="background: #28a745;">Bắt Đầu Chơi (Chủ phòng)</button>
        </div>

        <!-- Điều khiển Thành viên -->
        <div id="player-controls" style="display: none;">
            <button id="ready-btn" onclick="toggleReady()" style="background: #ffc107; color: black;">Sẵn Sàng</button>
        </div>

        <div id="lobby-error" class="error"></div>

        <hr style="margin: 20px 0;">
        <h3>Chat Tổng</h3>
        <div id="chat-messages"></div>
        <div style="display: flex; gap: 5px;">
            <input type="text" id="chat-input" placeholder="Nhập tin nhắn..." style="margin: 0;">
            <button onclick="sendChat()" style="width: auto; margin: 0; padding: 10px 15px;">Gửi</button>
        </div>
        <div id="chat-cooldown" class="cooldown"></div>

        <button class="btn-danger" onclick="leaveRoom()" style="margin-top: 15px;">Rời Phòng</button>
    </div>

    <!-- BƯỚC 4: MÀN HÌNH CHƠI GAME -->
    <div id="game-screen" class="card" style="display: none;">
        <div style="font-size: 18px; font-weight: bold; color: #dc3545; margin-bottom: 10px;">
            ⏳ Thời gian: <span id="time">10</span>s
        </div>
        <h3 id="q-number">Câu hỏi</h3>
        <h2 id="q-text" style="color: #333;">Nội dung câu hỏi</h2>

        <input type="text" id="answer-input" placeholder="Nhập đáp án...">
        <button onclick="submitAnswer()">Gửi Đáp Án</button>

        <div id="feedback" style="margin-top: 15px; font-weight: bold;"></div>

        <hr style="margin: 20px 0;">
        <h3>Bảng Xếp Hạng</h3>
        <ul id="score-list"></ul>
    </div>

    <!-- MÀN HÌNH KẾT THÚC -->
    <div id="game-over" class="card" style="display: none;">
        <h2>🎉 GAME KẾT THÚC 🎉</h2>
        <h3 id="winner-text" style="color: #28a745;"></h3>
        <button onclick="location.reload()">Chơi Lại</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
