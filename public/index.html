<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Đố Vui Trực Tuyến</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 90vh; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        button:hover { opacity: 0.9; }
        .btn-start { background: #ffc107; color: #212529; }
        .btn-danger { background: #dc3545; }
        .btn-success { background: #28a745; }
        .error { color: red; margin-top: 10px; font-size: 14px; }
        .hidden { display: none !important; }
        ul { list-style: none; padding: 0; text-align: left; }
        ul li { padding: 10px; border-bottom: 1px solid #eee; font-size: 16px; }
    </style>
</head>
<body>

    <!-- MÀN HÌNH 1: ĐĂNG NHẬP / TẠO TÀI KHOẢN -->
    <div id="login-screen" class="card">
        <h2>Đăng Nhập Game</h2>
        <input type="text" id="username" placeholder="Tên tài khoản">
        <input type="password" id="password" placeholder="Mật khẩu">
        <button onclick="handleLogin()">Vào Game</button>
        <div id="login-error" class="error"></div>
    </div>

    <!-- MÀN HÌNH 2: SẢNH CHÍNH (TẠO HOẶC VÀO PHÒNG) -->
    <div id="lobby-screen" class="card hidden">
        <h2>Xin chào, <span id="display-user"></span>!</h2>
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
        
        <h3>Tạo Phòng Mới</h3>
        <input type="password" id="new-room-pass" placeholder="Mật khẩu phòng (để trống nếu tự do)">
        <button class="btn-success" onclick="createRoom()">Tạo Phòng</button>

        <h3 style="margin-top: 30px;">Vào Phòng Có Sẵn</h3>
        <input type="text" id="join-room-code" placeholder="Nhập mã phòng 4 số">
        <input type="password" id="join-room-pass" placeholder="Mật khẩu phòng (nếu có)">
        <button onclick="joinRoom()">Tham Gia</button>
        
        <div id="lobby-error" class="error"></div>
    </div>

    <!-- MÀN HÌNH 3: PHÒNG CHỜ (LOBBY ROOM) -->
    <div id="room-screen" class="card hidden">
        <h2>Phòng: <span id="room-code-display"></span></h2>
        <p style="color: #666;">Danh sách người chơi trong phòng:</p>
        <ul id="players-list"></ul>

        <!-- Nút Bắt đầu chỉ hiện khi người chơi là CHỦ PHÒNG -->
        <button id="start-btn" class="btn-start hidden">Bắt Đầu Chơi</button>

        <button class="btn-danger" onclick="leaveRoom()" style="margin-top: 15px;">Rời Phòng</button>
    </div>

    <script>
        const socket = io();
        let currentUser = '';

        // Khôi phục tài khoản đã lưu để tránh văng khi thoát ra nhắn Zalo
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('game_username');
            const savedPass = localStorage.getItem('game_password');
            if (savedUser && savedPass) {
                document.getElementById('username').value = savedUser;
                document.getElementById('password').value = savedPass;
            }
        });

        function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!username || !password) {
                document.getElementById('login-error').innerText = 'Vui lòng nhập đủ tên và mật khẩu!';
                return;
            }
            socket.emit('login', { username, password });
        }

        socket.on('login_success', (data) => {
            currentUser = data.username;
            localStorage.setItem('game_username', currentUser);
            localStorage.setItem('game_password', document.getElementById('password').value.trim());

            document.getElementById('display-user').innerText = currentUser;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('hidden');
        });

        socket.on('login_error', (msg) => {
            document.getElementById('login-error').innerText = msg;
        });

        function createRoom() {
            const roomPassword = document.getElementById('new-room-pass').value.trim();
            socket.emit('create_room', { username: currentUser, roomPassword });
        }

        socket.on('room_created', (data) => {
            enterRoomUI(data.roomCode, data.isHost);
        });

        function joinRoom() {
            const roomCode = document.getElementById('join-room-code').value.trim();
            const roomPassword = document.getElementById('join-room-pass').value.trim();
            if (!roomCode) {
                document.getElementById('lobby-error').innerText = 'Vui lòng nhập mã phòng!';
                return;
            }
            socket.emit('join_room', { roomCode, roomPassword, username: currentUser });
        }

        socket.on('join_success', (data) => {
            enterRoomUI(data.roomCode, data.isHost);
        });

        socket.on('join_error', (msg) => {
            document.getElementById('lobby-error').innerText = msg;
        });

        function enterRoomUI(code, isHost) {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('room-screen').classList.remove('hidden');
            document.getElementById('room-code-display').innerText = code;
            
            // Xử lý ẩn/hiện nút Bắt Đầu Chơi
            const startBtn = document.getElementById('start-btn');
            if (isHost) {
                startBtn.classList.remove('hidden');
            } else {
                startBtn.classList.add('hidden');
            }
        }

        socket.on('update_players', (players) => {
            const list = document.getElementById('players-list');
            list.innerHTML = '';
            players.forEach(p => {
                const li = document.createElement('li');
                li.innerText = '• ' + p;
                list.appendChild(li);
            });
        });

        function leaveRoom() {
            location.reload(); // Tải lại trang để ra lại sảnh
        }
    </script>
</body>
</html>
